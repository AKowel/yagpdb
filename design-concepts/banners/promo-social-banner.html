<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Albert — promo/social banner</title>
<meta name="hz:slide-selector" content=".banner" />
<meta name="hz:canvas-width" content="1500" />
<meta name="hz:canvas-height" content="500" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap');

  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050608; }

  .banner {
    position: relative;
    width: 1500px;
    height: 500px;
    background: linear-gradient(135deg, #1a2230 0%, #0c0f14 100%);
    overflow: hidden;
    font-family: 'Lato', sans-serif;
  }
  .frame-outer { position: absolute; inset: 16px; border: 2px solid #c9a24b; pointer-events: none; }
  .frame-inner { position: absolute; inset: 27px; border: 1px solid rgba(201,162,75,0.45); pointer-events: none; }
  .sunburst { position: absolute; top: 0; left: 0; width: 1500px; height: 500px; }

  .mark { position: absolute; left: 105px; top: 75px; width: 350px; height: 350px; }

  .textblock {
    position: absolute;
    left: 520px;
    top: 0;
    width: 940px;
    height: 500px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 16px;
  }
  .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 92px;
    letter-spacing: 6px;
    line-height: 1;
    background: linear-gradient(135deg, #f1d68c, #c9a24b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule { width: 120px; height: 2px; background: linear-gradient(90deg, #c9a24b, transparent); margin: 24px 0 18px; }
  .tagline { font-family: 'Lato', sans-serif; font-style: italic; font-size: 24px; color: #b9c0cc; }
</style>
</head>
<body>
<div class="banner" data-canvas-width="1500" data-canvas-height="500">
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <svg class="sunburst" viewBox="0 0 1500 500">
    <line x1="470.0" y1="250.0" x2="610.0" y2="250.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="460.7" y1="308.7" x2="593.8" y2="352.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="433.7" y1="361.7" x2="547.0" y2="444.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="391.7" y1="403.7" x2="474.0" y2="517.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="338.7" y1="430.7" x2="382.0" y2="563.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="280.0" y1="440.0" x2="280.0" y2="580.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="221.3" y1="430.7" x2="178.0" y2="563.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="168.3" y1="403.7" x2="86.0" y2="517.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="126.3" y1="361.7" x2="13.0" y2="444.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="99.3" y1="308.7" x2="-33.8" y2="352.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="90.0" y1="250.0" x2="-50.0" y2="250.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="99.3" y1="191.3" x2="-33.8" y2="148.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="126.3" y1="138.3" x2="13.0" y2="56.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="168.3" y1="96.3" x2="86.0" y2="-17.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="221.3" y1="69.3" x2="178.0" y2="-63.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="280.0" y1="60.0" x2="280.0" y2="-80.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="338.7" y1="69.3" x2="382.0" y2="-63.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="391.7" y1="96.3" x2="474.0" y2="-17.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>

    <line x1="460.7" y1="191.3" x2="593.8" y2="148.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
  </svg>

  <svg class="mark" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#222b3a"/><stop offset="100%" stop-color="#121822"/>
      </linearGradient>
      <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f1d68c"/><stop offset="100%" stop-color="#c9a24b"/>
      </linearGradient>
    </defs>
    <circle cx="256" cy="256" r="248" fill="url(#bgM)" stroke="#c9a24b" stroke-width="8"/>
    <circle cx="256" cy="240" r="106" fill="url(#goldM)"/>
    <path d="M194 296 Q228 277 256 292 Q284 277 318 296 Q284 320 256 305 Q228 320 194 296 Z" fill="#121822"/>

    <line x1="322" y1="242" x2="340" y2="264" stroke="#121822" stroke-width="6" stroke-linecap="round"/>
    <path d="M178 322 L256 358 L334 322 L334 300 L256 332 L178 300 Z" fill="#eef1f5"/>

    <rect x="220" y="323" width="72" height="40" rx="10" fill="url(#goldM)" stroke="#121822" stroke-width="4"/>
  </svg>

  <div class="textblock">
    <div class="kicker">Discord Bot</div>
    <div class="wordmark">ALBERT</div>
    <div class="rule"></div>
    <div class="tagline">Always at your service.</div>
  </div>
</div>
</body>
</html>
