<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Albert — Discord bot profile banner</title>
<meta name="hz:slide-selector" content=".banner" />
<meta name="hz:canvas-width" content="960" />
<meta name="hz:canvas-height" content="320" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap');

  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050608; }

  .banner {
    position: relative;
    width: 960px;
    height: 320px;
    background: linear-gradient(135deg, #1a2230 0%, #0c0f14 100%);
    overflow: hidden;
    font-family: 'Lato', sans-serif;
  }
  .frame-outer { position: absolute; inset: 12px; border: 2px solid #c9a24b; pointer-events: none; }
  .frame-inner { position: absolute; inset: 20px; border: 1px solid rgba(201,162,75,0.45); pointer-events: none; }
  .sunburst { position: absolute; top: 0; left: 0; width: 960px; height: 320px; }

  .mark { position: absolute; left: 88px; top: 48px; width: 224px; height: 224px; }

  .textblock {
    position: absolute;
    left: 370px;
    top: 0;
    width: 550px;
    height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 8px;
  }
  .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 62px;
    letter-spacing: 5px;
    line-height: 1;
    background: linear-gradient(135deg, #f1d68c, #c9a24b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule { width: 90px; height: 2px; background: linear-gradient(90deg, #c9a24b, transparent); margin: 14px 0 10px; }
  .tagline { font-family: 'Lato', sans-serif; font-style: italic; font-size: 17px; color: #b9c0cc; }
</style>
</head>
<body>
<div class="banner" data-canvas-width="960" data-canvas-height="320">
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <svg class="sunburst" viewBox="0 0 960 320">
    <line x1="320.0" y1="160.0" x2="430.0" y2="160.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="312.8" y1="201.0" x2="416.1" y2="238.7" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="291.9" y1="237.1" x2="376.2" y2="307.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="260.0" y1="263.9" x2="315.0" y2="359.2" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="220.8" y1="278.2" x2="239.9" y2="386.5" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="179.2" y1="278.2" x2="160.1" y2="386.5" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="140.0" y1="263.9" x2="85.0" y2="359.2" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="108.1" y1="237.1" x2="23.8" y2="307.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="87.2" y1="201.0" x2="-16.1" y2="238.7" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="80.0" y1="160.0" x2="-30.0" y2="160.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="87.2" y1="119.0" x2="-16.1" y2="81.3" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="108.1" y1="82.9" x2="23.8" y2="12.2" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="140.0" y1="56.1" x2="85.0" y2="-39.2" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="179.2" y1="41.8" x2="160.1" y2="-66.5" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="220.8" y1="41.8" x2="239.9" y2="-66.5" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="260.0" y1="56.1" x2="315.0" y2="-39.2" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="291.9" y1="82.9" x2="376.2" y2="12.2" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="312.8" y1="119.0" x2="416.1" y2="81.3" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
  </svg>

  <svg class="mark" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#222b3a"/><stop offset="100%" stop-color="#121822"/>
      </linearGradient>
      <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f1d68c"/><stop offset="100%" stop-color="#c9a24b"/>
      </linearGradient>
    </defs>
    <circle cx="256" cy="256" r="248" fill="url(#bgM)" stroke="#c9a24b" stroke-width="8"/>
    <circle cx="256" cy="240" r="106" fill="url(#goldM)"/>
    <path d="M194 296 Q228 277 256 292 Q284 277 318 296 Q284 320 256 305 Q228 320 194 296 Z" fill="#121822"/>
    <circle cx="300" cy="222" r="30" fill="none" stroke="#121822" stroke-width="7"/>
    <line x1="322" y1="242" x2="340" y2="264" stroke="#121822" stroke-width="6" stroke-linecap="round"/>
    <path d="M178 322 L256 358 L334 322 L334 300 L256 332 L178 300 Z" fill="#eef1f5"/>
    <path d="M256 342 L168 316 L168 370 Z" fill="url(#goldM)"/>
    <path d="M256 342 L344 316 L344 370 Z" fill="url(#goldM)"/>
    <rect x="220" y="323" width="72" height="40" rx="10" fill="url(#goldM)" stroke="#121822" stroke-width="4"/>
  </svg>

  <div class="textblock">
    <div class="kicker">Discord Bot</div>
    <div class="wordmark">ALBERT</div>
    <div class="rule"></div>
    <div class="tagline">Always at your service.</div>
  </div>
</div>
</body>
</html>
