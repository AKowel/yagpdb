<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Albert — Discord server banner</title>
<meta name="hz:slide-selector" content=".banner" />
<meta name="hz:canvas-width" content="960" />
<meta name="hz:canvas-height" content="540" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap');

  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050608; }

  .banner {
    position: relative;
    width: 960px;
    height: 540px;
    background: linear-gradient(135deg, #1a2230 0%, #0c0f14 100%);
    overflow: hidden;
    font-family: 'Lato', sans-serif;
  }
  .frame-outer { position: absolute; inset: 16px; border: 2px solid #c9a24b; pointer-events: none; }
  .frame-inner { position: absolute; inset: 26px; border: 1px solid rgba(201,162,75,0.45); pointer-events: none; }
  .sunburst { position: absolute; top: 0; left: 0; width: 960px; height: 540px; }

  .mark { position: absolute; left: 51px; top: 81px; width: 378px; height: 378px; }

  .textblock {
    position: absolute;
    left: 470px;
    top: 0;
    width: 440px;
    height: 540px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 14px;
  }
  .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 84px;
    letter-spacing: 6px;
    line-height: 1;
    background: linear-gradient(135deg, #f1d68c, #c9a24b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule { width: 110px; height: 2px; background: linear-gradient(90deg, #c9a24b, transparent); margin: 22px 0 18px; }
  .tagline { font-family: 'Lato', sans-serif; font-style: italic; font-size: 22px; color: #b9c0cc; }
</style>
</head>
<body>
<div class="banner" data-canvas-width="960" data-canvas-height="540">
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <svg class="sunburst" viewBox="0 0 960 540">
    <line x1="440.0" y1="270.0" x2="580.0" y2="270.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="430.2" y1="331.8" x2="563.4" y2="375.1" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="401.8" y1="387.6" x2="515.1" y2="469.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="357.6" y1="431.8" x2="439.8" y2="545.1" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="301.8" y1="460.2" x2="345.1" y2="593.4" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="240.0" y1="470.0" x2="240.0" y2="610.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="178.2" y1="460.2" x2="134.9" y2="593.4" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="122.4" y1="431.8" x2="40.2" y2="545.1" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="78.2" y1="387.6" x2="-35.1" y2="469.8" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="49.8" y1="331.8" x2="-83.4" y2="375.1" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="40.0" y1="270.0" x2="-100.0" y2="270.0" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>

    <line x1="78.2" y1="152.4" x2="-35.1" y2="70.2" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="122.4" y1="108.2" x2="40.2" y2="-5.1" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>
    <line x1="178.2" y1="79.8" x2="134.9" y2="-53.4" stroke="#c9a24b" stroke-width="1.5" opacity="0.14"/>

  </svg>

        <stop offset="0%" stop-color="#222b3a"/><stop offset="100%" stop-color="#121822"/>
      </linearGradient>
      <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">

  <div class="textblock">
    <div class="kicker">Discord Bot</div>
    <div class="wordmark">ALBERT</div>

</html>
