<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Albert — GitHub social preview</title>
<meta name="hz:slide-selector" content=".banner" />
<meta name="hz:canvas-width" content="1280" />
<meta name="hz:canvas-height" content="640" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap');

  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050608; }

  .banner {
    position: relative;
    width: 1280px;
    height: 640px;
    background: linear-gradient(135deg, #1a2230 0%, #0c0f14 100%);
    overflow: hidden;
    font-family: 'Lato', sans-serif;
  }
  .frame-outer { position: absolute; inset: 18px; border: 2px solid #c9a24b; pointer-events: none; }
  .frame-inner { position: absolute; inset: 30px; border: 1px solid rgba(201,162,75,0.45); pointer-events: none; }
  .sunburst { position: absolute; top: 0; left: 0; width: 1280px; height: 640px; }

  .mark { position: absolute; left: 96px; top: 96px; width: 448px; height: 448px; }

  .textblock {
    position: absolute;
    left: 620px;
    top: 0;
    width: 620px;
    height: 640px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kicker {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 16px;
  }
  .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 104px;
    letter-spacing: 7px;
    line-height: 1;
    background: linear-gradient(135deg, #f1d68c, #c9a24b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule { width: 130px; height: 2px; background: linear-gradient(90deg, #c9a24b, transparent); margin: 26px 0 20px; }
  .tagline { font-family: 'Lato', sans-serif; font-style: italic; font-size: 25px; color: #b9c0cc; }
</style>
</head>
<body>

  <div class="frame-outer"></div>
  <div class="frame-inner"></div>
